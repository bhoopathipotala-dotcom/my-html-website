<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Lab Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <div class="aurora-orb orb-one"></div>
    <div class="aurora-orb orb-two"></div>
    <div class="login-shell">
      <div class="login-card">
        <div class="login-badge">Secure access</div>
        <h1>Welcome back</h1>
        <p>Enter your credentials to continue into Orbit Lab.</p>
        <form id="loginForm">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="admin" required />
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="1234" required />
          <button type="submit">Unlock mission portal</button>
        </form>
        <div id="loginMessage" class="message" role="status"></div>
        <div class="portal-actions">
          <a class="link" href="index.html">Open Home Page</a>
          <span class="helper-text">Use admin / 1234 to enter the mission portal.</span>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const message = document.getElementById('loginMessage');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (username === 'admin' && password === '1234') {
          localStorage.setItem('loggedIn', 'true');
          message.textContent = 'Login successful! Redirecting...';
          message.className = 'message success';
          setTimeout(function () {
            window.location.href = 'index.html';
          }, 800);
        } else {
          message.textContent = 'Invalid username or password.';
          message.className = 'message error';
        }
      });
    </script>
  </body>
</html>
