<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2575fc;
            margin-top: 0;
        }

        h2 {
            color: #444;
            margin-top: 24px;
        }

        p, li {
            line-height: 1.6;
            color: #555;
        }

        ul {
            padding-left: 20px;
        }

        .button-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2575fc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button-link:hover {
            background: #1d5fd1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Welcome to My Website</h1>
            <p>This website was created using CMD!</p>

            <h2>About Me</h2>
            <p>Hi, I'm Bhoopathi, a CSE student.</p>

            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>Python</li>
                <li>Machine Learning</li>
            </ul>

            <a class="button-link" href="login.html">Go to Login Page</a>
        </div>
    </div>
</body>
</html>
